<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>LoRaPTT</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="LoRaPTT.styles.css" rel="stylesheet" />
    <!-- MapLibre GL（節點地圖 F-037，函式庫本地打包，離線只缺圖磚）-->
    <link href="lib/maplibre/maplibre-gl.css" rel="stylesheet" />
</head>

<body>

    <!-- 狀態列空白由原生 inset padding 處理（MainActivity），不再用 CSS safe-area div -->

    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <!-- MapLibre GL + 節點地圖互通（F-037）-->
    <script src="lib/maplibre/maplibre-gl.js"></script>
    <script src="js/map-interop.js"></script>

    <script>
        // 將指定容器捲到最底（聊天收到新訊息時自動滑到最新，像 Line）
        window.scrollToBottom = function (id) {
            var el = document.getElementById(id);
            if (el) el.scrollTop = el.scrollHeight;
        };
    </script>

</body>

</html>
