[env:unit_c6l]
platform  = espressif32
board     = esp32-c6-devkitc-1
framework = arduino

; 上傳速率（Unit C6L 規格）
upload_speed = 1500000
monitor_speed = 115200

; 分區表（預留 OTA 空間）
board_build.partitions = default_16MB.csv

; 相依函式庫
lib_deps =
    ; SX1262 LoRa 驅動（RadioLib 支援 SX1262）
    jgromes/RadioLib @ ^6.6.0
    ; BLE（ESP32 Arduino 內建，不需額外宣告）

; 編譯旗標
build_flags =
    -DCORE_DEBUG_LEVEL=3
